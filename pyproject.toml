[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikh-local-bridge"
version = "0.2.0"
description = "Local-first runtime for reusable, provider-independent Skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "mcp>=1.9,<2.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0"]

[project.scripts]
ikh-bridge = "ikh_bridge.__main__:main"
ikh-bridge-mcp = "ikh_bridge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
